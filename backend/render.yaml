services:
  - type: web
    name: flowsync-api
    env: python
    plan: free # Strictly ensures you stay on the free tier
    # Added 'backend/' to the path so Render finds your file
    buildCommand: "pip install -r backend/requirements.txt" 
    # Added 'cd backend &&' so uvicorn runs from the correct folder
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false